<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم التحقق من البريد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<style>

body{
font-family:'Cairo',sans-serif;
background:#F6F7FA;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:40px;
width:400px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.icon {
margin-bottom: 30px;
}

.title{
text-align:center;
color: #1A1A1A;
font-size:22px;
font-weight:700;
line-height: 1.6;
margin-bottom:20px;
}

.subtitle{
text-align:center;
color:#606060;
font-size:14px;
line-height: 1.5;
}

</style>

</head>

<body>

<div class="container">

<div class="icon">
<lottie-player
id="shieldAnimation"
src="assets/animation/shield.json"
background="transparent"
style="width:150px;height:150px;margin:auto"
autoplay>
</lottie-player>
</div>

<div class="title">
تم التحقق من بريدك الإلكتروني وإنشاء حسابك بنجاح
</div>

<div class="subtitle">
يمكنك الآن العودة الى التطبيق والبدء في استخدامه 
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDVHSMk4YuVjhhaUIOvWykqZ_DMAZHlI7k",
authDomain: "signupapp-e1252.firebaseapp.com",
projectId: "signupapp-e1252",
storageBucket: "signupapp-e1252.firebasestorage.app",
messagingSenderId: "287910848295",
appId: "1:287910848295:web:14ac76cc5232a46f302b02",
measurementId: "G-84Q335J5WM"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params=new URLSearchParams(window.location.search);
const mode=params.get("mode");
const oobCode=params.get("oobCode");

if (mode === "resetPassword") {
window.location.href="reset.html"+window.location.search;
}

if (mode === "verifyEmail") {
if (oobCode) {
applyActionCode(auth, oobCode)
  
.then(() => {
console.log("Email verified successfully");
})

.catch((error) => {
console.error(error);
document.querySelector(".container").innerHTML=
"<h2 style='font-size:17px;color:red'>رابط التحقق غير صالح أو انتهت صلاحيته</h2>";
});
}
}

const animation=document.getElementById("shieldAnimation");

animation.addEventListener("ready",()=>{
animation.setSpeed(0.5); 
animation.setLooping(false); 
});

</script>

</body>
</html>
